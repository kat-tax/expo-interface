name: Windows

# Builds the example on Windows end to end on the line react-native-windows
# ships (0.84 while Expo 57's React Native 0.86 waits for a 0.86 line): the
# example's source in a scratch app with React Native pinned to it, this
# checkout's kit and runtime, `expo-windows init` writing the Windows
# project the way `ios/` and `android/` are generated, autolinking, the
# Windows JavaScript bundle and MSBuild with the v143 toolset. See
# scripts/windows-ci.sh.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'expo-windows/**'
      - 'example/**'
      - 'scripts/windows-ci/**'
      - 'scripts/windows-ci.sh'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'expo-windows/**'
      - 'example/**'
      - 'scripts/windows-ci/**'
      - 'scripts/windows-ci.sh'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The line react-native-windows ships, and its newest preview: each new
    # release gets a smoke run here, which is how the version wall closes.
    name: Build (react-native-windows ${{ matrix.line.rnw }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        line:
          - {rn: '', rnw: '0.84 (the template)', cli: '20.1.0', preview: false}
          - {rn: '0.85.3', rnw: '0.85.0-preview.1', cli: '20.2.0', preview: true}
    continue-on-error: ${{ matrix.line.preview }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: microsoft/setup-msbuild@v3
      - name: Cache the scratch app's npm store
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-windows-ci-${{ hashFiles('scripts/windows-ci/package.json') }}
          restore-keys: npm-windows-ci-
      - name: Build
        shell: bash
        run: scripts/windows-ci.sh "$RUNNER_TEMP/winci"
        env:
          RN_VERSION: ${{ matrix.line.rn }}
          RNW_VERSION: ${{ matrix.line.rn && matrix.line.rnw || '' }}
          CLI_VERSION: ${{ matrix.line.cli }}
      - name: Upload the app and the bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-${{ matrix.line.cli }}-${{ matrix.line.preview && 'preview' || 'stable' }}
          path: |
            ${{ runner.temp }}/winci/WinCi/windows/x64/*/*.exe
            ${{ runner.temp }}/winci/WinCi/windows/*/Bundle
            ${{ runner.temp }}/winci/WinCi/windows/AppPackages/*/*.msix
            ${{ runner.temp }}/winci/WinCi/windows/AppPackages/*/*.cer
          if-no-files-found: ignore
          retention-days: 7

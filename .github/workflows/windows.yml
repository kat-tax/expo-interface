name: Windows

# Builds the Windows platform end to end on the line react-native-windows
# ships (0.84 while Expo 57's React Native 0.86 waits for a 0.86 line): a
# scratch Expo 57 app with React Native pinned to it, this checkout's kit and
# runtime, `expo-windows init`, autolinking, MSBuild with the v143 toolset,
# and the Windows JavaScript bundle. See scripts/windows-ci.sh.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'windows/**'
      - 'expo-windows/**'
      - 'scripts/windows-ci/**'
      - 'scripts/windows-ci.sh'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'windows/**'
      - 'expo-windows/**'
      - 'scripts/windows-ci/**'
      - 'scripts/windows-ci.sh'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the pinned line
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: microsoft/setup-msbuild@v2
      - name: Cache the scratch app's npm store
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-windows-ci-${{ hashFiles('scripts/windows-ci/package.json') }}
          restore-keys: npm-windows-ci-
      - name: Build
        shell: bash
        run: scripts/windows-ci.sh "$RUNNER_TEMP/winci"
      - name: Upload the app and the bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: |
            ${{ runner.temp }}/winci/WinCi/windows/x64/Debug/WinCi.exe
            ${{ runner.temp }}/winci/WinCi/windows/WinCi/Bundle
          if-no-files-found: ignore
          retention-days: 7

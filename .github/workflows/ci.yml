name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test:coverage
      - name: Upload test report (@vitest/ui HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  device:
    # The example as a running app, driven through the harness and read back
    # through its accessibility tree. This is the layer the component suite
    # cannot reach: a whole app with its own Babel configuration and a real
    # renderer. A completely broken web build once passed every component test,
    # which is what this job exists to catch.
    name: Drive the example (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium for the harness
        run: bunx playwright install --with-deps chromium
      - name: Serve the example
        working-directory: example
        run: |
          CI=1 npx expo start --web --port 8085 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8085 || true)" = "200" ] && break
            sleep 5
          done
          curl -sf --max-time 30 http://localhost:8085 > /dev/null
      - name: Drive it
        env:
          HARNESS_PLATFORM: web
          HARNESS_URL: http://localhost:8085
        run: bun run test:device
      - name: Upload what it saw
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-evidence
          path: |
            .harness
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    # Metro bundles once per platform, which is the cheapest proof that every
    # `index.ios.tsx` / `index.android.tsx` / `index.web.tsx` and their
    # `@expo/material-symbols/*.xml` assets resolve — no Xcode or Gradle needed.
    name: Bundle example (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android, web]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Expo doctor
        # Advisory only: expo-doctor also reports SDK-wide advisories that can
        # only be resolved by an SDK upgrade (e.g. the SDK 56 Hermes notice).
        if: matrix.platform == 'web'
        continue-on-error: true
        run: bunx expo-doctor
        working-directory: example
      - name: Export
        run: bunx expo export --platform ${{ matrix.platform }} --output-dir dist
        working-directory: example
        env:
          CI: 1

  storybook:
    name: Build Storybook (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Export
        run: bun run storybook:build
        env:
          CI: 1
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: storybook
      - name: Test stories (@storybook/addon-vitest, headless Chromium)
        run: bun run storybook:test
        env:
          CI: 1
      - uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook/dist
          retention-days: 7

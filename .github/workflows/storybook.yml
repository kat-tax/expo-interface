name: Storybook

# Publishes the web Storybook — plus the Vitest HTML test report at /tests
# and the coverage report at /coverage — to GitHub Pages on every push to
# master.
# Requires Pages to be enabled with "GitHub Actions" as the source
# (Settings → Pages); private repos need a plan that includes Pages.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Export
        run: bun run storybook:build
        env:
          CI: 1
          # Pages serves project sites from `/<repo>/`.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Test report and coverage
        run: |
          bun run test:coverage
          cp -r test-report storybook/dist/tests
          cp -r coverage storybook/dist/coverage
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Release

# Publishes both packages when a `v*` tag is pushed.
#
# The tag names the kit's version and must match the root `package.json`. The
# runtime carries its own version, because it ships on its own schedule, and is
# published at whatever `expo-windows/package.json` says. Either package is
# skipped when the registry already has that version, so a tag that only moves
# one of them publishes only that one (see .github/publish.sh).
#
# Publishing is npm trusted publishing (OIDC): this repository and this workflow
# are registered as trusted publishers on npmjs.com, so no token secret is
# involved and provenance is attested automatically. A package's first publish
# cannot happen here; publish.sh says what to do about that.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Update npm (trusted publishing needs >= 11.5)
        run: npm install -g npm@latest
      - name: Check the tag matches the kit's version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Publish expo-interface
        run: bash .github/publish.sh .
      - name: Publish expo-windows
        run: bash .github/publish.sh expo-windows
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

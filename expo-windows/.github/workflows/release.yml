name: Release

# Publishes the package when a `v*` tag is pushed. The tag must match
# `package.json`'s version.
#
# Publishing is npm trusted publishing (OIDC): this repository and this workflow
# are registered as the package's trusted publisher on npmjs.com, so no token
# secret is involved and provenance is attested automatically. A package's first
# publish cannot happen here; publish.sh says what to do about that.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Update npm (trusted publishing needs >= 11.5)
        run: npm install -g npm@latest
      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Publish
        run: bash .github/publish.sh .
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
